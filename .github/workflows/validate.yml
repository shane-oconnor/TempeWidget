name: validate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A real compile needs the per-device definitions, which are only
      # available behind a Garmin account login, so it cannot run here.
      # tools/build-matrix.sh does that locally. These are the checks that
      # do not need the SDK.
      - name: Static checks
        run: python3 tools/validate.py
